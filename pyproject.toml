[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-view-textbook-kg"
version = "0.1.0"
description = "Reusable interfaces for existing textbook structure graphs and incremental concept graphs"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Fuqi1211"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/Fuqi1211/dual-view-textbook-kg"
Issues = "https://github.com/Fuqi1211/dual-view-textbook-kg/issues"

[project.optional-dependencies]
neo4j = ["neo4j>=5,<7"]
legacy-pdf = ["PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[project.scripts]
dual-kg = "dual_kg.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dual_kg*", "domain_ckg_workspace*", "examples*", "legacy_text_graph_tools*"]
namespaces = true

[tool.setuptools.package-data]
dual_kg = ["resources/config/*.yaml", "resources/prompts/incremental_v5/*.txt"]
