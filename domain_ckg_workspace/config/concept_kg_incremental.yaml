domain: 计算机相关领域的概念知识，包括程序设计、数据结构、算法、计算机系统、网络、数据库和软件工程；课程信息用于消歧，不限制相同概念跨课程复用。
workers: 16
chunk_chars: 4500
evidence_chars: 650
prior_concepts: 60
prior_relations: 100
context_claims: 30
service_retries: 6
response_repairs: 0
projection_seconds: 300
llm:
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  model: deepseek-ai/DeepSeek-V4-Flash
  temperature: 0
  max_tokens: 12000
  timeout_seconds: 240
  extra_body:
    enable_thinking: false
embedding:
  base_url: https://api.siliconflow.cn/v1
  api_key_env: SILICONFLOW_API_KEY
  model: BAAI/bge-m3
  batch_size: 16
  timeout_seconds: 180
neo4j:
  database: neo4j
  batch_size: 200
